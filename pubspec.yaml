name: rostrik_mvp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Local storage (V1 MVP — strictly local, offline-first).
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  uuid: ^4.0.0

  # Alarm engine. flutter_local_notifications drives delivery via
  # AndroidScheduleMode.alarmClock (AlarmManager.setAlarmClock under the hood),
  # which bypasses Doze and battery optimization on modern Android without
  # requiring USE_EXACT_ALARM. timezone is required by zonedSchedule for DST.
  # permission_handler covers POST_NOTIFICATIONS (Android 13+) + iOS auth.
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Resolves the device's IANA tz id at runtime so zonedSchedule pins to a
  # real location (DST-correct) instead of guessing.
  flutter_timezone: ^5.0.2
  permission_handler: ^12.0.1

  # State management bridge — exposes repository streams to the widget
  # tree. Provider was chosen for V1 over Riverpod/Bloc: smallest API
  # surface for the two-stream + two-write-handle scope we actually have.
  provider: ^6.1.0

  # Calendar grid for the Roster's Calendar view. Picked over a custom
  # GridView because table_calendar already handles month math (first
  # DOW, leading/trailing days, leap years), page-swipe between months,
  # and gives a cell-builder hook (`CalendarBuilders.defaultBuilder` and
  # friends) that lets us replace the entire cell — required for the
  # Android-widget-style horizontal bars (no default dot markers).
  table_calendar: ^3.2.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  google_mlkit_text_recognition: ^0.15.1
  sensors_plus: ^7.0.0

  # iOS-only at runtime: resolves the app container's Library/ dir so the
  # bundled WAV assets can be copied into Library/Sounds/, where
  # UNNotificationSound resolves them by name (no Xcode bundle membership).
  # Already present transitively via hive_ce_flutter; declared directly because
  # we import it.
  path_provider: ^2.1.0
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates Hive TypeAdapters for @HiveType-annotated classes/enums.
  hive_ce_generator: ^1.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled alarm tones (16-bit PCM WAV @ 44.1 kHz). Master copies, copied to
  # iOS Library/Sounds at startup. The Android notification-channel copies live
  # separately in android/app/src/main/res/raw/. See assets/sounds/README.md
  # for prep + the res/raw mp3→wav swap note.
  assets:
    - assets/sounds/
    # Branding (app logo etc.). Folder registration: any file dropped in is
    # bundled automatically — add rostrik_logo.png here for the WelcomeScreen
    # hero (it falls back to an icon until the file exists).
    - assets/images/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ── App launcher icons (flutter_launcher_icons) ──────────────────────────────
# Generates Android mipmaps + iOS AppIcon set from one master PNG. Run after
# dropping the source in: `dart run flutter_launcher_icons`.
# Source: a 1024x1024 PNG at the path below (the same asset the WelcomeScreen
# hero uses). Adaptive (Android 8+) uses a pitch-black background to match the
# forced-dark theme; iOS strips alpha (the App Store rejects transparent icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/rostrik_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/rostrik_logo.png"

# ── Native splash screen (flutter_native_splash) ─────────────────────────────
# Pitch-black splash that flows seamlessly into the forced-dark app. Run after
# dropping the source in: `dart run flutter_native_splash:create`.
# `image` is the centred logo; the Android 12+ block is required separately
# because S+ uses the platform splash API (its icon is masked to a circle).
flutter_native_splash:
  color: "#000000"
  image: assets/images/rostrik_logo.png
  android_12:
    color: "#000000"
    image: assets/images/rostrik_logo.png
  android: true
  ios: true
  web: false
