org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 FULL MODE — pinned explicitly (Play Console: "Improve your app's memory and
# performance with R8 optimisation").
#
# Code shrinking/optimisation and resource shrinking are already ON: Flutter's
# Gradle plugin sets `isMinifyEnabled = true` + `isShrinkResources = true` on the
# release build type for us (FlutterPlugin.kt), and the shipped 1.2.0+9 bundle
# carries the R8 marker `"r8-mode":"full","version":"8.11.18"` in classes.dex —
# i.e. full mode was already active via the AGP 8.x default.
#
# It is pinned here anyway so the behaviour is declared rather than inherited: a
# future AGP flipping its default (or a `--no-shrink` style flag creeping into a
# build script) would silently drop the optimisation, and the alarm engine's
# reflection-sensitive surfaces are exactly where that regression would hurt.
android.enableR8.fullMode=true
# OPTIMISED RESOURCE SHRINKING — Play Console asked for this by name
# ("Optimised resource shrinking isn't enabled", 2026-09-18). It is a SEPARATE
# thing from `isShrinkResources`, which Flutter already sets: that removes
# unreferenced resources, while this lets R8 use what it learned shrinking the
# CODE to decide which resources are genuinely reachable, and to shrink the
# resource TABLE itself rather than only blanking entries.
#
# Off by default in AGP 8.x, on by default from AGP 9 — so this is adopting the
# future default early, not taking an exotic option. Verified after enabling:
# every native string in all 17 res folders still present in resources.pb, and
# all 15 languages still resolve. That check matters here more than usual
# because resource shrinking is exactly what would silently eat a translation.
android.r8.optimizedResourceShrinking=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
